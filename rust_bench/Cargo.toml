[package]
name = "rust_bench"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
polars = { version = "0.53", features = ["lazy", "csv", "dtype-i16", "dtype-u16", "performant"] }
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
